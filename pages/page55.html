<button onclick='frac()' id='btn'>අරඹන්න</button>
<script>
var n=0;
function frac(){
btn.innerHTML="නැවත";
n++;if(n>8){n=1}
if(n==1){
katex.render(algebra.toTex('(1\\cfrac{2}{3}+2\\cfrac{1}{2})\\div 2\\cfrac{2}{3}'),box);

katex.render(algebra.toTex('1\\cfrac{1}{4} - \\cfrac{1}{2}'),box1);
}
if(n==2){
katex.render(algebra.toTex('=(\\cfrac{5}{3}+\\cfrac{5}{2})\\div \\cfrac{8}{3}'),box2);

katex.render(algebra.toTex('\\cfrac{5}{4} - \\cfrac{1}{2}'),box3);
msg1.innerHTML="විෂම භාග කිරීම";
}
if(n==3){
katex.render(algebra.toTex('=(\\cfrac{10}{6}+\\cfrac{15}{6})\\div \\cfrac{8}{3}'),box4);

msg2.innerHTML="වරහන තුළ  + ";
}

}
if(n==5){
katex.render(algebra.toTex('=\\cfrac{25}{6}\\div \\cfrac{8}{3}\\times \\cfrac{5}{4} - \\cfrac{1}{2}'),box8);

katex.render(algebra.toTex('=\\cfrac{25}{6}\\div \\cfrac{40}{12} - \\cfrac{1}{2}'),box9);
}
if(n==6){
katex.render(algebra.toTex('=\\cfrac{\\cancel{25} 5}{\\cancel{6} 1}\\times \\cfrac{\\cancel{12} 2}{\\cancel{40} 8} - \\cfrac{1}{2}'),box10);

}

}
