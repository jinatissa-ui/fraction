<p >&nbsp; &nbsp; &nbsp; සජාතීය සමූහයකින් කොටසක් භාග ලෙස හඳුනා ගනිමු.</p>

<span id='t4'></span> 
<span id='t5'></span>


<br>
<button class='btn2' onclick='frac1()'>මුලු ගොඩෙන් භාග</button>
<br>

<script>
var n=0;var m=0; var s="";var s1='';var s2="";
