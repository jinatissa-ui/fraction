<h2>භාග දශමවලට හරවමු.</h2>

<p>&nbsp; &nbsp; සමහර භාග හරය 10, 100, 1000...ආදී වන ආකාරයට තුල්‍ය භාග ලෙස සකස් කර ගත හැක. </p>

<tr><td id='tx1'></td><td id='t1'></td><td id='tt1'></td><td id=''>0.5</td></tr>

<script>

katex.render(algebra.toTex('\\frac {1}{2}'),tx1);
katex.render(algebra.toTex('1\\frac {2}{5}'),tx2);

katex.render(algebra.toTex('\\frac {1\\times5}{2\\times5}'),t1);

katex.render(algebra.toTex('\\frac {5}{10}'),tt1);
katex.render(algebra.toTex('1\\frac {4}{10}'),tt2);
katex.render(algebra.toTex('\\frac {75}{100}'),tt3);
katex.render(algebra.toTex('2\\frac {625}{1000}'),tt4);

</script>
