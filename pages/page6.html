<body>

<style>span{font-size:18px; text-align:justify}</style>

<h2>භාග වර්ග හඳුනා ගනිමු.</h2>
<p style='color:blue'>තත්‍ය භාග</p>
<p>&nbsp; &nbsp; &nbsp;එකට වඩා අගයෙන් අඩු බිංදුවට වඩා වැඩි සියලු භාග සංඛ්‍යා නියම භාග හෙවත් තත්‍ය භාග යනුවෙන් හඳුන්වයි. එනම් මෙම භාගවල ලවය හරයට වඩා කුඩා ය.</p>
<center>
<div style='height:200px'>
<div id='box1' ></div>


<span id='box2' style='font-size:40;'></span>

</div>
<button class='btn2' onclick='frac1()'>තත්‍ය භාග</button>
</center>

<br>
<p style='color:blue' >&nbsp; &nbsp; &nbsp; එකට වඩා විශාල භාග එනම්  ලවය හරයට වඩා විශාල තත්‍ය නොවන භාග ඇත. ඒවා ගැන පසුව ඉගෙන ගත හැක.</p>
<script>
var n=0;var m=0; var s="";
function frac1(){
n=2+Math.floor(Math.random()*15);
m=1+Math.floor(Math.random()*(n-1));
s="";box1.innerHTML="";
s="<svg width='300px' height='100px'>";

for(i=0;i<n;i++){
s+="<rect x="+(((250/n)*i)+10)+" y=10 width="+(250/n)+" height=50 stroke='black' fill='none' />";
}
for(i=0;i<m;i++){
s+="<rect x="+(((250/n)*i)+10)+" y=10 width="+(250/n)+" height=50 stroke='black' fill='gold' />";
}

box1.innerHTML=s+"</svg>";


box2.innerHTML="<table border=0 cellpadding=0 style='text-align:center;font-size:30px'><tr><td style='border-bottom:solid thin'>"+m+"</td></tr><tr><td>"+n+"</td></tr></table>";
}

</script>

</body>
