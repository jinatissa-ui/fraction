<h2>ලාභය / අලාභය සෙවීම පුහුණුවට.</h2>

<table border=1 width='380px' style='border-collapse:collapse'>
<tr><th colspan=4>වික්ක මිල දුන් විට</th></tr>
<tr><td>වික්ක මිල </td><td>= B</td><th rowspan=2>ලාභය  =</th><td rowspan=2 style='color:blue' id='box1' bgcolor='#ffff88'></td></tr>
<tr><td>ලාභ  ප්‍රතිශතය </td><td>= C%</td></tr>
<tr><td>වික්ක මිල </td><td>= B</td><th rowspan=2>අලාභය =</th><td rowspan=2 style='color:blue' id='box2' bgcolor='#ffffaa'></td></tr>
<tr><td> අලාභ ප්‍රතිශතය </td><td>= C%</td></tr>

</table>

<br><br>
<button  onclick='nxt()' style='' id='btn1'>වෙනත්</button> ----------&nbsp; &nbsp;  &nbsp; &nbsp;  &nbsp; &nbsp;  &nbsp; &nbsp;  &nbsp; &nbsp;  &nbsp; &nbsp;  &nbsp; &nbsp; ---------

<button  onclick='ans()' style=''    id='btn2'>සොයන්න</button>
<br><br>
<div>ඔබටද අගයන්  යෙදිය හැක. <br>ලාභ / අලාභ ප්‍රතිශගය තෝරන්න.</div><br>
<script>
katex.render(algebra.toTex('\\frac {C}{100+C}\\times B'),box1);
katex.render(algebra.toTex('\\frac {C}{100-C}\\times B'),box2);
</script>



<script>




//var n=0;
function nxt(){
//n++;if(n>10)n=1;
var a = new Array(50,150,320,120,1200,560,480,3500,2500,880)
var p = new Array(10,15,30,20,12,50,40,16,25,8);

var n= Math.floor(Math.random()*10);
var m= Math.floor(Math.random()*10);

t1.innerHTML=a[n];
t2.innerHTML=p[m];
sel.selectedIndex=0;
 t4.innerHTML=''; t5.innerHTML='';
  msg2.innerHTML='';
  t5.style.borderBottom='';
}
function ans(){
var a=eval(t1.innerHTML);var b=eval(t2.innerHTML);
if(sel.selectedIndex==0){
katex.render(algebra.toTex('\\frac {'+ b+'}{'+(100+b)+'}\\times '+a),t4);

t5.innerHTML="රු.  "+((a*b)/(100+b)).toFixed(2);


msg2.innerHTML="&nbsp; ලාභය";

}
else{
katex.render(algebra.toTex('\\frac {'+ b+'}{'+(100-b)+'}\\times '+a),t4);

t5.innerHTML="රු.  "+((a*b)/(100-b)).toFixed(2);
msg2.innerHTML="&nbsp; අලාභය";
}






t5.style.borderBottom='double';
}
//-------------




</script>
