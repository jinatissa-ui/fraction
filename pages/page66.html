<h2>භාග දශමවලට හරවමු.</h2>

<p>&nbsp; &nbsp; දීර්ඝ බෙදීම් කර පහත භාග දශමවලට හරවා බලන්න. </p>
<table width='380px' style='font-size:16px'>
<tr><td id='tx1'></td><td id='t1'></td><td id='tt1'></td><td id=''></td></tr>
<tr><td id='tx2'></td><td id='t2'></td><td id='tt2'></td><td id='ttx2'></td></tr>
<tr><td id='tx3'></td><td id='t3'></td><td id='tt3'></td><td id='ttx3'></td></tr>

</table>
<script>

katex.render(algebra.toTex('\\frac {3}{8}'),tx1);
katex.render(algebra.toTex('1\\frac {1}{3}'),tx2);
katex.render(algebra.toTex('\\frac {2}{7}'),tx3);
katex.render(algebra.toTex('3\\frac {5}{6}'),tx4);

katex.render(algebra.toTex(3/8),t1);
katex.render(algebra.toTex(1+1/3),t2);
katex.render(algebra.toTex(2/7),t3);
katex.render(algebra.toTex(3+5/6),t4);


katex.render(algebra.toTex('1.\\dot 3'),tt2);
katex.render(algebra.toTex('0.\\dot28571\\dot4'),tt3);
katex.render(algebra.toTex('3.8\\dot3'),tt4);

</script>
<p>නැවත නැවත එකම සංඛ්‍යාව ලැබෙන විට දශම සංඛ්‍යාව ට ඉහළින් තිතක් තබා එය <u>සමාවර්ත දශමය</u> ලෙස හඳුන්වයි.</p>
<p>ලැබෙන භාග දශමවලට හරවා ඇති අයුරු බලන්න. ඔබට කැමති භාග සංඛ්‍යාද යෙදිය හැක.</p>



<script>
katex.render(algebra.toTex('\\frac {3}{4}=0.75'),b1);
katex.render(algebra.toTex('\\frac {2}{3}=0.6666..'),b2);
</script>
<table border=0 style='font-size:20px'>
<tr><td rowspan=2 width='80px'><button  onclick='frac()' style='width:70px'>භාගය</button></td><th rowspan=2 id='n1' width='30px' style='text-align:right' contenteditable=true>1</th><th id='up' width='30px' style='border-bottom:solid thin' contenteditable=true>2</th><td rowspan=2></td></tr>
<tr> <th id='down' contenteditable=true>3</th></tr>


<tr><td><button  onclick='des()' style='width:70px'>දශම</button></td><td colspan=4 id='box2'></td></tr>

</table>
 





<script>
var n=0;
function frac(){
n++;if(n>10)n=1;
var a1=new Array('','',1,2,5,'',3,6,'',7);
var b1=new Array(2,5,1,2,5,14,3,6,20,7);
var c1=new Array(5,6,9,3,8,5,7,11,9,8);
n1.innerHTML=a1[n-1];
up.innerHTML=b1[n-1];
down.innerHTML=c1[n-1];
box2.innerHTML='';
}
function des(){
var nu=eval(up.innerHTML);
var di=eval(down.innerHTML);
var num=eval(n1.innerHTML);
if(n1.innerHTML==''){num=0;}

box2.innerHTML= ' = '+(num+ nu/di) ;
}




</script>
