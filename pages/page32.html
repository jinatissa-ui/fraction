<h2>මිශ්‍ර සංඛ්‍යා විෂම භාගවලට හැරවීම.</h2>




<center>
<img src='../images/frac3.gif' />
</center>
<p>මෙම ක්‍රියාවේ අදහස පහත ආකාරයට තේරුම් ගන්න.</p>
<div id='box'></div><br>
<button onclick='frac()'>උදාහරණ</button>
<br><br><br><center>
<div id='box2' style='width:150px;height:60px;border-radius:60px;padding:20px' class='sty' ></div></center>
<script>
var f1='2\\cfrac{3}{5}= 2 + \\cfrac{3}{5} =  \\cfrac{10}{5} + \\cfrac{3}{5} = \\cfrac{13}{5}'
katex.render(algebra.toTex(f1),box);
function frac(){
var n1=2+Math.floor(Math.random()*10);
var n2=2+Math.floor(Math.random()*10);
var n3=n2-(1+Math.floor(Math.random()*8));
if(n3<1){n3=1}
var n4=(n1*n2)+n3 ;
var f2=''+n1+'\\cfrac{'+n3+'}{'+n2+'}=\\cfrac{'+n4+'}{'+n2+'}'
katex.render(algebra.toTex(f2),box2);
}
</script>
