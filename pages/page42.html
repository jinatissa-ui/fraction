<script>

function frac3(){

}}}}}

}

 aa=eval(a1+aa1)+b1; var p1='+';
 try{if(a1==''&& aa1==''){aa=eval(a1+aa1+b1); p1=''}}catch(er){alert(er);}

while (c != 0) {
a = b % c;b = c;c = a;
}

}else{var a, b, c;

 }
