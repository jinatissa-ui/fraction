<h2>භාග සංසන්දනය කරමු.</h2>
<p> &nbsp; &nbsp; භාග දෙක අතර ඇති ඊතලය මගින් සුදුසු ලකුණ තෝරන්න..</p>


 <table style='font-size:20px;font-family:arial;text-align:center'>
<tr><td id='no' style='font-size:18px;width:50px'>1).</td>
<td style='border-bottom:solid thin;width:40px' id='fr1'>1</td>
<td rowspan=2 id='sl'>
<select onchange='chang()' id='sel'>

<option>=</option>
</select>
</td>
<td style='border-bottom:solid thin;width:40px' id='txt1'>1</td><td rowspan=2 id='cw'>&nbsp </td>
</tr>
<tr><td></td>
<td id='fr2' style='width:40px'>3</td><td style='width:40px'  id='txt2'>2</td>
</tr>
</table>
<br>


<button class='btn2' onclick='fract1()' id='but' disabled=disabled>වෙනත් භාගයක්</button>&nbsp; &nbsp;      &nbsp; &nbsp; <button class='btn2' onclick='fract2()' id='but1' >හරි වැරදි</button>


<script>
var c,w; 
c="<svg width='40px' height='40px'><g transform='translate(5,5)scale(1.3)'><path d='M25,0 Q15,12 12,25' fill='none'  stroke='red' style='stroke-width:2px'/><line x1=12 y1=25 x2=5 y2=10 stroke='red' style='stroke-width:2px'/></g></svg>";
w="<svg width='40px' height='40px'><g transform='translate(5,5)scale(1.3)'><path d='M25,0 Q15,12 12,25' fill='none' stroke='red' style='stroke-width:2px'/><line x1=10 y1=5 x2=25 y2=25 stroke='red' style='stroke-width:2px'/></g></svg>";

var n=3;var m=1;var num=1;var n2=2;var m2=1;var t=1;
function fract1(){
but.disabled=true;
but1.disabled=false;
num++;
if(num>10){
num=1;
mark.innerHTML="";
box.innerHTML="";
box2.innerHTML="";ma=0;
}
no.innerHTML= num+").";
n=2+Math.floor(Math.random()*10);
m=1+Math.floor(Math.random()*(n-1));
var t=1+Math.floor(Math.random()*5);
n2=n*t;
m2=1+Math.floor(Math.random()*(n2-1));

fr1.innerHTML=m;
fr2.innerHTML=n;
cw.innerHTML="";
txt1.innerHTML=m2;
txt2.innerHTML=n2;
sl.innerHTML="<select onchange='chang()' id='sel'><option>?</option><option>></option><option><</option><option>=</option></select>"
}
var s="";
function chang(){s=sel.selectedIndex;
sl.innerHTML=sel.value;

}

var c2,w2; 
c2="<svg width='20px' height='20px'><g transform='translate(5,5)scale(0.5)'><path d='M25,0 Q15,12 12,25' fill='none'  stroke='red' style='stroke-width:2px'/><line x1=12 y1=25 x2=5 y2=10 stroke='red' style='stroke-width:2px'/></g></svg>";
w2="<svg width='20px' height='20px'><g transform='translate(5,5)scale(0.5)'><path d='M25,0 Q15,12 12,25' fill='none' stroke='red' style='stroke-width:2px'/><line x1=10 y1=5 x2=25 y2=25 stroke='red' style='stroke-width:2px'/></g></svg>";


var cor=""; var ma=0;
function fract2(){
but.disabled=false;

but1.disabled=true;
if((m/n)>(m2/n2) && s==1){cw.innerHTML=c;cor=c2;ma++;}
else if((m/n)<(m2/n2) && s==2){cw.innerHTML=c;cor=c2;ma++;}
else if((m/n)==(m2/n2) && s==3){cw.innerHTML=c;cor=c2;ma++;}
else{cw.innerHTML=w;cor=w2;};

if(num<6){

box.innerHTML+="<table border=0 cellpadding=0 style='text-align:center;font-size:16px'><tr><td rowspan=2>"+num+").</td><td style='border-bottom:solid thin'>"+m+"</td> <td rowspan=2>"+sl.innerHTML+"</td><td style='border-bottom:solid thin'>"+m2+"</td><td rowspan=2>"+cor+"</td> </tr><tr><td>"+n+"</td> <td >"+n2+"</td></tr></table>";




}
if(num>5){
box2.innerHTML+="<table border=0 cellpadding=0 style='text-align:center;font-size:16px'><tr><td rowspan=2>"+num+").</td><td style='border-bottom:solid thin'>"+m+"</td> <td rowspan=2>"+sl.innerHTML+"</td><td style='border-bottom:solid thin'>"+m2+"</td><td rowspan=2>"+cor+"</td> </tr><tr><td>"+n+"</td> <td >"+n2+"</td></tr></table>";

}
if(num==10){
mark.innerHTML=ma*10+'%';
}



}
