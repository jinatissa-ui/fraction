<script>

var n1=0;var n2=0; var s1="";var s2="";var tx,tx2,t;

for(i=0;i<n1;i++){
s1+="<rect x="+(((200/n1)*i)+10)+" y=10 width="+(200/n1)+" height=30 stroke='black' fill='none' />";
}
for(i=0;i<1;i++){
s1+="<rect x="+(((200/n1)*i)+10)+" y=10 width="+(200/n1)+" height=30 stroke='black' fill='gold' />";
}
box1.innerHTML=s1+"</svg>";
//-----------------------
s2="";box2.innerHTML="";

for(i=0;i<n2;i++){
s2+="<rect x="+(((200/n2)*i)+10)+" y=10 width="+(200/n2)+" height=30 stroke='black' fill='none' />";
}
for(i=0;i<1;i++){

}

bx1.innerHTML="<table border=0 cellpadding=0 style='text-align:center;font-size:12px'><tr><td style='border-bottom:solid thin'>1</td></tr><tr><td>"+n1+"</td></tr></table>" ;
bx2.innerHTML= "<table border=0 cellpadding=0 style='text-align:center;font-size:12px'><tr><td style='border-bottom:solid thin'>1</td></tr><tr><td>"+n2+"</td></tr></table>";
d1.innerHTML=n1;d2.innerHTML=n2;txt.innerHTML=tx2; u1.innerHTML=1;u2.innerHTML=1;
