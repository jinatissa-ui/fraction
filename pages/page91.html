<h2>ලාභ අලාභ  ප්‍රතිශතය සෙවීම පුහුණුවට.</h2>

<table border=0>

<tr><td>ලාභ ප්‍රතිශතය</td><td id='b1' style='color:blue'></td></tr>



<tr><th colspan=2>අලාභයක් නම්</th></tr>
<tr><td>අලාභය</td><td>= A - B</td></tr>
<tr><td>අලාභ ප්‍රතිශතය</td><td id='b2' style='color:blue'></td></tr>


</table>




<br>
<button  onclick='nxt()' style='' id='btn1'>වෙනත්</button> &nbsp; &nbsp; <span> ඔබටද අගයන්  යෙදිය හැක.</span>


<button  onclick='ans()' style=''    id='btn2'>සොයන්න</button>
<br><br>

<script>
katex.render(algebra.toTex('=\\frac {B-A}{A}\\times 100\\%'),b1);
katex.render(algebra.toTex('=\\frac {A-B}{A}\\times 100\\%'),b2);
</script>



<script>




var n=0;
function nxt(){


n++;if(n>10)n=1;
var a= 50+ Math.floor(Math.random()*200);
t1.innerHTML=a;
var b= 100+ Math.floor(Math.random()*200);
t2.innerHTML=b;
 t3.innerHTML='';
 t4.innerHTML=''; t5.innerHTML='';
  msg1.innerHTML=''; msg2.innerHTML='';
  t5.style.borderBottom='';
}
function ans(){
var a=eval(t1.innerHTML);var b=eval(t2.innerHTML);
if(b>a){
t3.innerHTML= b +' - '+ a + ' = '+ (b-a) ;
katex.render(algebra.toTex('\\frac {'+ (b-a)+'}{'+a+'}\\times 100\\%'),t4);
if(((b-a)*100)%a == 0){
t5.innerHTML=((b-a)/a)*100 +'%';
}else{t5.innerHTML=(((b-a)/a)*100).toFixed(2) +'%';}
msg1.innerHTML="ලාභය රු.";
msg2.innerHTML="ලාභ ප්‍රතිශතය ";
}
if(b<a){
t3.innerHTML= a +' - '+ b + ' = '+ (a-b) ;
katex.render(algebra.toTex('\\frac {'+ (a-b)+'}{'+a+'}\\times 100\\%'),t4);
if(((a-b)*100)%a == 0){
t5.innerHTML=((a-b)/a)*100 +'%';
}else{t5.innerHTML=(((a-b)/a)*100).toFixed(2) +'%';}
msg1.innerHTML="අලාභය රු.";
msg2.innerHTML="අලාභ ප්‍රතිශතය ";
}
if(a==b){msg1.innerHTML="ලාභ අලාභ නැත";msg2.innerHTML="";
t3.innerHTML='';t5.innerHTML='0%';t4.innerHTML='';

}
t5.style.borderBottom='double';
}
//-------------




</script>
