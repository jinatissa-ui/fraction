<script>




//var n=0;
function nxt(){
//n++;if(n>10)n=1;
var a = new Array(40,150,320,120,200,60,180,520,400,880)
var p = new Array(10,15,30,20,12,50,40,16,25,8);

var n= Math.floor(Math.random()*10);
var m= Math.floor(Math.random()*10);

t1.innerHTML=a[n];
t2.innerHTML=p[m];
sel.selectedIndex=0;
 t4.innerHTML=''; t5.innerHTML='';
 
  t5.style.borderBottom='';
}
function ans(){
var a=eval(t1.innerHTML);var b=eval(t2.innerHTML);
if(sel.selectedIndex==0){
katex.render(algebra.toTex('\\frac {'+(100)+'}{'+(b)+'}\\times '+a),t4);

t5.innerHTML="රු.  "+(((100)/b)*a).toFixed(2);


la.innerHTML="&nbsp; ලාභය";

}
else{
katex.render(algebra.toTex('\\frac {'+(100)+'}{'+(b)+'}\\times '+a),t4);

t5.innerHTML="රු.  "+(((100)/b)*a).toFixed(2);

}






t5.style.borderBottom='double';
}
