<script>

var u1=0; var d1=0; var u2=0; var d2=0;var m;

n++;if(n>14){n=0}

box1.innerHTML="<table border=0 cellpadding=0 style='text-align:center;font-size:18px'><tr><td style='border-bottom:solid thin'>"+u1[n]+"</td> <td rowspan=2>, &nbsp</td><td style='border-bottom:solid thin'>"+u2[n]+"</td> </tr><tr><td>"+d1[n]+"</td> <td >"+d2[n]+"</td></tr></table>හරය සමාන කිරීමට පළමු භාගය "+m[n]+"න් ගුණකරමු";

if((u1[n]*m[n])>(u2[n])){sl='>';ss='විශාලයි'}else{sl='<';ss=' කුඩයි';}

}
